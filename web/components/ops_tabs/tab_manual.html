      <!-- ======================================= -->
      <!-- TAB 9: 手动模式 (控制台) -->
      <!-- ======================================= -->
      <section class="tab-content-panel" id="tab-manual">
        
        <div class="grid-2">
          <div id="manual-cmd-list">
            <!-- 动态填充一键复制与执行命令卡片 -->
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">💻 远程控制台输出</div>
              <button class="btn btn-secondary btn-sm" onclick="ManualMode.clearConsole()">清屏</button>
            </div>
            <div class="terminal-console" id="manual-console-output">
              <div class="log-info">点击左侧命令的【⚡ 执行】或在下方输入自定义命令...</div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <input type="text" class="form-control" id="input-manual-custom-cmd" placeholder="输入在机器人上执行的 Bash 命令...">
              <label style="display: flex; align-items: center; gap: 4px; font-size: 0.78rem; white-space: nowrap;">
                <input type="checkbox" id="chk-manual-sudo" checked> sudo
              </label>
              <button class="btn btn-primary" id="btn-manual-custom-run">执行</button>
            </div>
          </div>
        </div>
      </section>
