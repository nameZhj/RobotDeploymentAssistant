      <!-- ======================================= -->
      <!-- TAB 6: 舞蹈动作更新 -->
      <!-- ======================================= -->
      <section class="tab-content-panel" id="tab-dance-update">
        
        <div class="card">
          <div class="card-header">
            <div class="card-title">💃 导入新舞蹈动作包</div>
            <span class="card-badge">自动解压覆盖与热重启</span>
          </div>
          <div class="grid-2">
            <div>
              <div class="form-group">
                <label class="form-label">选择舞蹈动作文件夹 / 动作包 (单个)</label>
                <div
                  style="border: 2px dashed rgba(56, 189, 248, 0.35); border-radius: 8px; padding: 26px 16px; text-align: center; background: rgba(14, 165, 233, 0.04); transition: all 0.2s; cursor: pointer;"
                  id="dropzone-update-zip">
                  <div style="font-size: 2.4rem; margin-bottom: 8px;">📁</div>
                  <div style="font-weight: 600; color: var(--text-primary); font-size: 0.95rem; margin-bottom: 4px;"
                    id="text-zip-filename">点击选择动作文件夹 / 拖拽动作包至此处</div>
                  <div style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 14px;"
                    id="text-zip-filesize">支持点击选择文件夹，或拖拽单个动作文件夹 / .zip 压缩包导入</div>
                  <input type="file" id="input-update-folder" webkitdirectory directory style="display: none;">
                  <input type="file" id="input-update-zip" accept=".zip,.ZIP" style="display: none;">
                  <div style="display: flex; justify-content: center;" onclick="event.stopPropagation()">
                    <button type="button" class="btn btn-secondary btn-sm" id="btn-browse-dance-folder">
                      📁 选择动作文件夹
                    </button>
                  </div>
                </div>
              </div>

              <div class="form-group" style="margin-top: 14px;">
                <label class="form-label">远端目标覆盖路径</label>
                <input type="text" class="form-control" id="input-update-dest-path" value="/secure/config_vsis" readonly
                  style="background: rgba(0,0,0,0.25); color: var(--text-secondary); cursor: not-allowed;">
              </div>


              <button class="btn btn-primary" id="btn-submit-dance-update" style="width: 100%; margin-top: 8px;">
                🚀 一键上传并导入舞蹈动作包
              </button>
              <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; line-height: 1.5;">
                ⚡ <b>全自动生效流程：</b> 上传动作包 ➔ <b>自动解压覆盖至 <code>/secure/config_vsis</code></b> ➔ <b>自动热重启机载运控与跳舞程序</b>
              </div>
            </div>

            <div>
              <div class="card-header" style="margin-bottom: 8px;">
                <div class="card-title" style="font-size: 0.9rem;">📋 导入与热重启输出</div>
              </div>
              <div class="terminal-console" id="dance-update-result" style="height: 320px;">
                <div class="log-info">等待选择并上传新舞蹈动作包 (.zip 或动作文件夹)...</div>
              </div>
            </div>
          </div>
        </div>
      </section>
