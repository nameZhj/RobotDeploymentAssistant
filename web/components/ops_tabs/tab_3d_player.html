<!-- ======================================= -->
<!-- TAB 7: 3D 舞蹈预览播放器 -->
<!-- ======================================= -->
<section class="tab-content-panel" id="tab-3d-player">

  <div class="player3d-container">
    <!-- 3D 视口 -->
    <div class="player3d-viewport" id="dance3d-viewport">
      <div class="player3d-controls-overlay">
        <button class="btn btn-primary btn-sm" id="btn-dance-play">▶️ 播放</button>
        <input type="range" id="dance-scrubber" min="0" max="300" value="0" style="flex: 1; cursor: pointer;">
        <span id="dance-time-text"
          style="font-family: monospace; font-size: 0.78rem; color: #ffffff; min-width: 160px;">0.0s / 6.0s</span>
        <select class="btn btn-secondary btn-sm" id="select-dance-speed" style="padding: 4px 8px;">
          <option value="0.5">0.5x</option>
          <option value="1.0" selected>1.0x (50fps)</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
        </select>
        <label style="display: flex; align-items: center; gap: 4px; font-size: 0.78rem; cursor: pointer;">
          <input type="checkbox" id="chk-dance-loop" checked> 循环
        </label>
        <button class="btn btn-secondary btn-sm" id="btn-reset-cam">🔄 视角复位</button>
      </div>
    </div>

    <!-- 舞蹈库列表侧边栏 -->
    <div class="player3d-sidebar" style="display: flex; flex-direction: column; gap: 8px;">
      <div
        style="font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 6px;">
        <span>💃 舞蹈动作库</span>
        <div style="display: flex; gap: 4px;">
          <label class="btn btn-primary btn-xs" id="btn-import-custom-dance-file"
            style="cursor: pointer; padding: 4px 9px; font-size: 0.74rem; font-weight: 700; background: linear-gradient(135deg, #0ea5e9, #0284c7);"
            title="导入动作或机器人模型 (.zip / .npz)，系统自动识别并解压至 preview 目录">
            📥 导入动作
            <input type="file" id="input-custom-dance-file" style="display: none;" accept=".zip,.npz,.ZIP,.NPZ"
              multiple>
          </label>
        </div>
      </div>

      <!-- 本地路径快捷导入与浏览栏 (支持如 g1_29dof_rubber_hand.zip 绝对路径) -->
      <div
        style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 5px 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;">
          <span style="font-size: 0.72rem; color: #cbd5e1; font-weight: 600;">本地压缩包路径 (自动解压至 preview)</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <input type="text" class="form-control" id="input-dance-zip-path" placeholder="输入或浏览 ZIP 路径..."
            style="font-size: 0.74rem; font-family: monospace; padding: 3px 6px; flex: 1; min-width: 0;"
            value="E:\myfile\xwechat_files\wxid_j7m2dqj20npw21_e0ac\msg\file\2026-09\g1_29dof_rubber_hand.zip">
          <button type="button" class="btn btn-secondary btn-xs" id="btn-browse-dance-zip"
            style="font-size: 0.72rem; padding: 3px 6px; white-space: nowrap; font-weight: 600;">
            📁 浏览
          </button>
          <button type="button" class="btn btn-success btn-xs" id="btn-submit-zip-path"
            style="font-size: 0.72rem; padding: 3px 8px; white-space: nowrap; font-weight: 700;">
            🚀 解析播放
          </button>
        </div>
      </div>

      <div id="dance-3d-list"
        style="display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0;">
        <!-- 动态填充 -->
      </div>
      <div style="font-size: 0.7rem; color: var(--text-muted); text-align: center; line-height: 1.3;">
        支持拖拽 .zip 或 .npz 文件至此
      </div>
    </div>
  </div>
</section>
