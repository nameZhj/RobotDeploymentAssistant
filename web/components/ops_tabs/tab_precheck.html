      <section class="tab-content-panel" id="tab-precheck">
        
        <div class="card" style="padding: 12px 16px; margin-bottom: 0;">

              <span>🛠️ 机器人运行环境深度预检与修复</span>

          </div>
          <div id="tp-precheck-items" class="precheck-grid">

          </div>
