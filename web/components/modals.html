  <!-- 一键修复实时日志弹窗 (支持步骤进度条与终端实时回显) -->
  <div id="fix-stream-modal"
    style="display: none; position: fixed; inset: 0; background: rgba(5, 8, 16, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10005; align-items: center; justify-content: center; padding: 20px;">
    <div class="card"
      style="width: 720px; max-width: 92vw; border: 1px solid rgba(0, 210, 255, 0.4); box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 210, 255, 0.25);">
      <div class="card-header"
        style="border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; margin-bottom: 14px;">
        <div class="card-title" style="display: flex; align-items: center; gap: 8px;">
          <span id="fix-modal-icon">🛠️</span>
          <span id="fix-modal-title">正在执行机器人端驱动编译与修复</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm"
            onclick="copyToClipboard(document.getElementById('fix-stream-console')?.innerText, '任务执行日志已复制')">📋
            复制日志</button>
          <button class="btn btn-secondary btn-sm" id="btn-close-fix-modal" onclick="Wizard.closeFixModal()">关闭</button>
        </div>
      </div>

      <!-- 进度条 -->
      <div
        style="margin-bottom: 14px; background: rgba(0,0,0,0.3); padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);">
        <div
          style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.82rem;">
          <span id="fix-step-status-text" style="color: var(--accent-cyan); font-weight: 600;">⏳ 正在初始化编译环境...</span>
          <span id="fix-step-percent" style="font-family: monospace; font-weight: 700; color: #ffffff;">10%</span>
        </div>
        <div class="progress-bar-wrap"
          style="height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;">
          <div class="progress-bar-fill" id="fix-step-progress-bar"
            style="width: 10%; height: 100%; background: linear-gradient(90deg, #00d2ff, #00ff88); transition: width 0.3s ease;">
          </div>
        </div>
      </div>

      <div class="terminal-console" id="fix-stream-console"
        style="height: 320px; font-size: 0.78rem; font-family: monospace; line-height: 1.5; background: #080c14; border-radius: 6px; padding: 12px; overflow-y: auto;">
        <div class="log-info">正在与机器人建立安全通道并下发修复指令...</div>
      </div>
    </div>
  </div>

  <!-- 添加受控机器人模态弹窗 (自定义 ID 对应 lora_robot_id.txt) -->
  <div id="modal-add-robot" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-container">
      <div class="custom-modal-header">
        <div class="custom-modal-title">
          <span class="icon">🤖</span>
          <span>添加受控机器人 (Add Target Robot)</span>
        </div>
        <button class="custom-modal-close" id="btn-close-add-robot-modal" title="关闭 (Esc)">✕</button>
      </div>
      <div class="custom-modal-body">
        <div class="modal-field-group">
          <label class="modal-label" for="input-new-robot-id">
            <span>机器人 ID (唯一标识):</span>
            <span class="label-hint">需与机器人 <code>lora_robot_id.txt</code> 一致</span>
          </label>
          <div class="modal-input-wrapper">
            <input type="text" id="input-new-robot-id" class="form-input modal-input"
              placeholder="输入 ID (如 B, C, R1, G1_02, 01...)" maxlength="20" autocomplete="off">
            <button class="btn btn-primary" id="btn-submit-add-robot">✓ 确认添加</button>
          </div>
          <div class="modal-quick-suggestions">
            <span class="suggestion-label">快捷推荐:</span>
            <div class="suggestion-chips" id="add-robot-chips-container">
              <!-- 由 JS 动态填充推荐 chips -->
            </div>
          </div>
        </div>
        <div class="modal-note-box">
          <div class="note-title">📖 《群控商业化补充说明》规范：</div>
          <div class="note-desc">
            每台机器人部署时在 <code>/home/ubuntu/vsis_mimic_deploy/group/lora_robot_id.txt</code> 写入唯一 ID，LoRa 广播将按此 ID
            寻址（<code>TARGET|COMMAND\n</code>）。
          </div>
        </div>
      </div>
      <div class="custom-modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-add-robot">取消</button>
      </div>
    </div>
  </div>

  <!-- 全局 Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>
