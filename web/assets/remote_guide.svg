<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 手柄外壳轮廓 -->
  <path d="M 220 80 C 140 80, 100 160, 110 320 C 115 390, 160 420, 230 380 C 290 350, 320 320, 400 320 C 480 320, 510 350, 570 380 C 640 420, 685 390, 690 320 C 700 160, 660 80, 580 80 Z" 
        fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="3" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.6))"/>

  <!-- 顶部肩键 L1 / L2 / R1 / R2 -->
  <rect x="170" y="40" width="90" height="30" rx="8" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
  <text x="215" y="60" fill="#00f0ff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">L1 (Group 1)</text>

  <rect x="150" y="10" width="80" height="24" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="27" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">L2 (Group 3)</text>

  <rect x="540" y="40" width="90" height="30" rx="8" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
  <text x="585" y="60" fill="#00f0ff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">R1 (Group 2)</text>

  <rect x="570" y="10" width="80" height="24" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="27" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">R2 (辅助键)</text>

  <!-- 左侧十字方向键 (D-Pad) -->
  <g transform="translate(230, 200)">
    <!-- 上下左右 -->
    <rect x="-14" y="-45" width="28" height="90" rx="4" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
    <rect x="-45" y="-14" width="90" height="28" rx="4" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
    <circle cx="0" cy="0" width="20" height="20" fill="#0f172a"/>
    <text x="0" y="-24" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">UP</text>
    <text x="0" y="34" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">DOWN</text>
    <text x="-30" y="5" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">LEFT</text>
    <text x="30" y="5" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">RIGHT</text>
  </g>

  <!-- 右侧动作按键 (X, Y, A, B) -->
  <g transform="translate(570, 200)">
    <!-- Y (上) -->
    <circle cx="0" cy="-32" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-26" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">Y</text>
    <!-- A (下) -->
    <circle cx="0" cy="32" r="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="38" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">A</text>
    <!-- X (左) -->
    <circle cx="-32" cy="0" r="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="-32" y="6" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">X</text>
    <!-- B (右) -->
    <circle cx="32" cy="0" r="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="32" y="6" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  </g>

  <!-- 中间摇杆与按键 -->
  <!-- 左摇杆 -->
  <circle cx="310" cy="270" r="32" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="310" cy="270" r="22" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
  <text x="310" y="275" fill="#94a3b8" font-size="10" text-anchor="middle">移动摇杆</text>

  <!-- 右摇杆 -->
  <circle cx="490" cy="270" r="32" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <circle cx="490" cy="270" r="22" fill="#334155" stroke="#00f0ff" stroke-width="2"/>
  <text x="490" y="275" fill="#94a3b8" font-size="10" text-anchor="middle">转向摇杆</text>

  <!-- SELECT / START -->
  <rect x="340" y="185" width="45" height="18" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <text x="362" y="198" fill="#e2e8f0" font-size="9" font-weight="bold" text-anchor="middle">SELECT</text>

  <rect x="415" y="185" width="45" height="18" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <text x="437" y="198" fill="#e2e8f0" font-size="9" font-weight="bold" text-anchor="middle">START</text>

  <!-- 宇树 LOGO / 标题 -->
  <text x="400" y="135" fill="#00f0ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2" filter="url(#glow)">UNITREE G1 CONTROLLER</text>
  <text x="400" y="155" fill="#64748b" font-size="11" text-anchor="middle">LoRa 虚拟无线遥控寻址模式</text>

  <!-- 底部急停标注 -->
  <rect x="300" y="420" width="200" height="34" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="442" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">急停指令: ALL|STOP / EMERGENCY</text>
</svg>
